# A NIF is a shared library; musl targets link statically by default, which
# rules out cdylibs (https://github.com/rust-lang/rust/issues/59302).
[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-feature=-crt-static"]

[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "target-feature=-crt-static"]
