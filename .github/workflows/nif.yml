name: NIF

# Builds the precompiled NIFs (NIF version 2.15, for OTP 22+) as workflow
# artifacts, one per target. The release workflow calls it before uploading
# them to the GitHub release. Run it by hand for a dry run of those builds:
# nothing is uploaded to a release or published.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# The Linux builds run in containers on the native runner: gnu in
# manylinux_2_28 (glibc 2.28, the floor the NIFs must not exceed), musl in
# Alpine. Images are pinned by digest, as is rustup-init by checksum. No
# caches: every build starts clean.

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            manylinux: quay.io/pypa/manylinux_2_28_x86_64@sha256:39df0042d5cc900b085aa25a0659368b42a0006c54c474299b785b44c1b4ff82
            rustup_init_sha256: dda7234360b7f578ca8b0ddcb80145646fa61a67c1720a5abc7051b35c9fcb71
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            manylinux: quay.io/pypa/manylinux_2_28_aarch64@sha256:f5f03dedf61b47d69d0742d36047db78adeee3bdb7a9910ff52304750ecf2514
            rustup_init_sha256: 15f6e4ce9f583b929c996c91562bad6d4454f3281de858b02cdfdef615fac433
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            alpine: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            alpine: true
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-pc-windows-msvc
            os: windows-2022
    env:
      TARGET: ${{ matrix.target }}
      # Never link an AWS-LC that happens to be installed on the runner.
      AWS_LC_SYS_USE_SYSTEM: "0"
      # Windows: AWS-LC's assembly from the crate's prebuilt NASM objects.
      AWS_LC_SYS_PREBUILT_NASM: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        if: ${{ !matrix.alpine && !matrix.manylinux }}
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Build
        if: ${{ !matrix.alpine && !matrix.manylinux }}
        shell: bash
        run: scripts/build-nif.sh "$TARGET"

      # rust:1.96-alpine3.22 (multi-arch index)
      - name: Build in Alpine
        if: ${{ matrix.alpine }}
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e TARGET -e AWS_LC_SYS_USE_SYSTEM \
            rust@sha256:fa16d058a94f0f1cf86cbbbd181a2ea2a0001e1fba1e93c366821a58f3e6c8a1 \
            sh -c 'apk add --no-cache musl-dev gcc g++ make perl && scripts/build-nif.sh "$TARGET"'

      # rustup 1.29.1 installs Rust 1.96.0, the version of the Alpine image.
      - name: Build in manylinux_2_28
        if: ${{ matrix.manylinux }}
        env:
          IMAGE: ${{ matrix.manylinux }}
          RUSTUP_INIT_SHA256: ${{ matrix.rustup_init_sha256 }}
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e TARGET -e AWS_LC_SYS_USE_SYSTEM -e RUSTUP_INIT_SHA256 "$IMAGE" sh -euc '
            curl -sSf -o /tmp/rustup-init "https://static.rust-lang.org/rustup/archive/1.29.1/$(uname -m)-unknown-linux-gnu/rustup-init"
            echo "$RUSTUP_INIT_SHA256  /tmp/rustup-init" | sha256sum -c
            chmod +x /tmp/rustup-init
            /tmp/rustup-init -y -q --profile minimal --default-toolchain 1.96.0
            . "$HOME/.cargo/env"
            scripts/build-nif.sh "$TARGET"'

      - name: Check the glibc floor
        if: ${{ matrix.manylinux }}
        run: scripts/check-nif-glibc.sh 2.28 nif-dist/*.tar.gz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nif-${{ matrix.target }}
          path: nif-dist/*.tar.gz
          if-no-files-found: error
